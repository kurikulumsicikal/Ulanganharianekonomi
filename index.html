<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Ujian Berbasis Komputer - CBT</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #0f172a;
            --accent: #f59e0b;
            --bg-glass: rgba(255, 255, 255, 0.95);
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #333;
        }

        /* Container Card Utama */
        .app-container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-glass);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        /* Header */
        .app-header {
            background: linear-gradient(to right, #1e3a8a, var(--primary));
            color: white;
            padding: 25px 20px;
            text-align: center;
            position: relative;
        }

        .app-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .app-header p {
            font-size: 0.85rem;
            opacity: 0.85;
        }

        /* Form Login / Input Data */
        .form-section {
            padding: 30px 25px;
        }

        .form-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* Area Pilihan Mata Pelajaran */
        .mapel-section {
            display: none;
            padding: 30px 25px;
        }

        .student-info-bar {
            background: #f1f5f9;
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            border-left: 4px solid var(--primary);
        }

        .mapel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .card-mapel {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card-mapel:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        .mapel-icon {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .mapel-name {
            font-weight: 600;
            color: var(--secondary);
            font-size: 0.95rem;
        }

        /* Peringatan Pelanggaran / Warning Toast */
        .warning-box {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--danger);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
            z-index: 9999;
            text-align: center;
            font-weight: 600;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(-50%); }
            20%, 60% { transform: translateX(-55%); }
            40%, 80% { transform: translateX(-45%); }
        }

        /* Area Frame Soal Ujian */
        .exam-section {
            display: none;
            width: 100%;
            height: 85vh;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Responsive UI */
        @media (max-width: 600px) {
            .app-container { border-radius: 12px; }
            .mapel-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <!-- Box Peringatan Pindah Tab / Browser -->
    <div id="warningBox" class="warning-box">
        ⚠️ DILARANG MENINGGALKAN HALAMAN UJIAN!<br>
        <span id="warningText" style="font-size:0.8rem; font-weight:normal;">Pelanggaran telah dicatat oleh sistem.</span>
    </div>

    <!-- Container Utama -->
    <div id="mainContainer" class="app-container">
        
        <!-- Header Portal -->
        <div class="app-header">
            <h1>PORTAL UJIAN ONLINE</h1>
            <p>SMAN 1 Cikalongwetan</p>
        </div>

        <!-- Section 1: Form Login Data Siswa -->
        <div id="loginSection" class="form-section">
            <div class="form-title">Konfirmasi Data Peserta</div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="namaSiswa">Nama Lengkap Siswa</label>
                    <input type="text" id="namaSiswa" placeholder="Masukkan nama sesuai absen" required>
                </div>
                <div class="form-group">
                    <label for="kelasSiswa">Kelas</label>
                    <select id="kelasSiswa" required>
                        <option value="">-- Pilih Kelas --</option>
                        <option value="XII IPA 1">XII IPA 1</option>
                        <option value="XII IPA 2">XII IPA 2</option>
                        <option value="XII IPS 1">XII IPS 1</option>
                        <option value="XII IPS 2">XII IPS 2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="passwordUjian">Password / Tokan Ujian</label>
                    <input type="password" id="passwordUjian" placeholder="Masukkan token ujian" required>
                </div>
                <button type="submit" class="btn-submit">Masuk Ke Ruang Ujian</button>
            </form>
        </div>

        <!-- Section 2: Pilihan Mata Pelajaran -->
        <div id="mapelSection" class="mapel-section">
            <div class="student-info-bar">
                <div>
                    Selamat datang, <strong id="displayName">-</strong> (<span id="displayKelas">-</span>)
                </div>
                <div>
                    Status: <span style="color: #10b981; font-weight:bold;">Siswa Terverifikasi</span>
                </div>
            </div>

            <div class="form-title">Pilih Mata Pelajaran</div>
            
            <div class="mapel-grid">
                <!-- GANTI ISI LINK GOOGLE FORM DI DALAM ONCLICK -->
                <div class="card-mapel" onclick="mulaiUjian('https://docs.google.com/forms/d/e/PASTE_LINK_FORM_GEOGRAFI/viewform')">
                    <div class="mapel-icon">🌍</div>
                    <div class="mapel-name">GEOGRAFI</div>
                </div>
                
                <div class="card-mapel" onclick="mulaiUjian('https://docs.google.com/forms/d/e/PASTE_LINK_FORM_SOSIOLOGI/viewform')">
                    <div class="mapel-icon">👥</div>
                    <div class="mapel-name">SOSIOLOGI</div>
                </div>
                
                <div class="card-mapel" onclick="mulaiUjian('https://docs.google.com/forms/d/e/PASTE_LINK_FORM_BIOLOGI/viewform')">
                    <div class="mapel-icon">🧬</div>
                    <div class="mapel-name">BIOLOGI</div>
                </div>
                
                <div class="card-mapel" onclick="mulaiUjian('https://docs.google.com/forms/d/e/PASTE_LINK_FORM_EKONOMI/viewform')">
                    <div class="mapel-icon">📈</div>
                    <div class="mapel-name">EKONOMI</div>
                </div>
            </div>
        </div>

        <!-- Section 3: Frame Tempat Membuka Soal Ujian -->
        <div id="examSection" class="exam-section">
            <iframe id="examFrame" src=""></iframe>
        </div>

    </div>

    <script>
        // Set Password/Token Ujian di sini (bisa diubah sesuai keinginan)
        const TOKEN_UJIAN_VALID = "SMAN12026";

        let jumlahPelanggaran = 0;
        let isUjianBerlangsung = false;

        // Function Login
        function handleLogin(event) {
            event.preventDefault();
            
            const nama = document.getElementById('namaSiswa').value;
            const kelas = document.getElementById('kelasSiswa').value;
            const password = document.getElementById('passwordUjian').value;

            // Cek Password
            if (password !== TOKEN_UJIAN_VALID) {
                alert("Password / Token Ujian Salah! Silakan tanyakan kepada pengawas.");
                return;
            }

            // Simpan Tampilan Data Siswa
            document.getElementById('displayName').innerText = nama;
            document.getElementById('displayKelas').innerText = kelas;

            // Pindah Tampilan
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('mapelSection').style.display = 'block';
        }

        // Function Mulai Ujian (Buka Form)
        function mulaiUjian(urlForm) {
            if(!urlForm || urlForm.includes("PASTE_LINK_FORM")) {
                alert("Link Google Form belum diisi oleh admin/pengawas.");
                return;
            }

            // Atur Ukuran Tampilan Full Screen Frame
            const mainContainer = document.getElementById('mainContainer');
            mainContainer.style.maxWidth = "100%";
            mainContainer.style.borderRadius = "0px";

            document.getElementById('mapelSection').style.display = 'none';
            document.getElementById('examSection').style.display = 'block';
            
            // Set URL Form
            document.getElementById('examFrame').src = urlForm;
            
            // Aktifkan Status Keamanan Ujian
            isUjianBerlangsung = true;
        }

        // ==========================================
        // FITUR DETEKSI KECURANGAN / PERINGATAN
        // ==========================================

        // 1. Peringatan saat siswa meninggalkan/pindah TAB atau BROWSER (Blur / VisibilityChange)
        document.addEventListener('visibilitychange', function() {
            if (isUjianBerlangsung && document.hidden) {
                catatPelanggaran("Anda terdeteksi berpindah tab/aplikasi!");
            }
        });

        window.addEventListener('blur', function() {
            if (isUjianBerlangsung) {
                catatPelanggaran("Fokus browser hilang / Anda meninggalkan layar ujian!");
            }
        });

        // 2. Peringatan saat mencoba menutup/reload halaman
        window.addEventListener('beforeunload', function (e) {
            if (isUjianBerlangsung) {
                const confirmationMessage = 'Ujian sedang berlangsung! Yakin ingin keluar?';
                (e || window.event).returnValue = confirmationMessage;
                return confirmationMessage;
            }
        });

        // Function Menampilkan Peringatan
        function catatPelanggaran(pesan) {
            jumlahPelanggaran++;
            const warningBox = document.getElementById('warningBox');
            const warningText = document.getElementById('warningText');
            
            warningText.innerText = `${pesan} (Pelanggaran ke-${jumlahPelanggaran})`;
            warningBox.style.display = 'block';

            // Sembunyikan peringatan setelah 4 detik
            setTimeout(() => {
                warningBox.style.display = 'none';
            }, 4000);
        }
    </script>
</body>
</html>
