<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Online Aman</title>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #f4f4f9;
            font-family: Arial, sans-serif;
        }
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            padding: 20px;
        }
        #overlay h2 {
            margin-bottom: 10px;
        }
        #overlay p {
            max-width: 400px;
            font-size: 14px;
            color: #ddd;
            line-height: 1.5;
        }
        #overlay button {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #overlay button:hover {
            background: #218838;
        }
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Layar Pengunci Layar Penuh (Full Screen) -->
    <div id="overlay">
        <h2>Ujian Online Mode Aman</h2>
        <p>Dilarang keluar dari layar ujian, berpindah tab, atau membuka aplikasi lain selama ujian berlangsung.</p>
        <button onclick="startExam()">Mulai Ujian Sekarang</button>
    </div>

    <!-- LINK GOOGLE FORM KAMU SUDAH TERPASANG DI SINI -->
    <iframe id="exam-frame" src="https://docs.google.com/forms/d/e/1FAIpQLSfkWYjbedejkV_rdRCiHiKe2fqdf-TwaqaV8Dxze75dzUl_Dg/viewform?embedded=true"></iframe>

    <script>
        let warningCount = 0;
        const maxWarnings = 3; // Batas keluar tab sebelum diblokir

        function startExam() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari / iOS */
                elem.webkitRequestFullscreen();
            }
            document.getElementById('overlay').style.display = 'none';
        }

        // 1. Deteksi Pindah Tab atau Pindah Aplikasi
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                warningCount++;
                if (warningCount < maxWarnings) {
                    alert(`PERINGATAN!\nKamu terdeteksi meninggalkan halaman ujian!\nPelanggaran ke-${warningCount} dari ${maxWarnings}.`);
                } else {
                    alert("Akses Ujian Diblokir!\nKamu telah melebihi batas toleransi berpindah tab/aplikasi.");
                    document.body.innerHTML = "<div style='display:flex; justify-content:center; align-items:center; height:100vh; background:#111; color:red; font-family:sans-serif;'><h1>AKSES DITOLAK: Anda terdeteksi melakukan kecurangan.</h1></div>";
                }
            }
        });

        // 2. Mencegah Klik Kanan
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 3. Mencegah Kombinasi Tombol Shortcut (Copy, Paste, DevTools)
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey || e.keyCode === 123) {
                e.preventDefault();
                alert("Fitur tombol kombinasi (Copy/Paste/Inspect) dimatikan!");
            }
        });
    </script>
</body>
</html>
