<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Ujian CBT - Ekonomi SMAN 1 Cikalongwetan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #1a73e8;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #5f6368;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            color: #3c4043;
            display: block;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #1a73e8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1557b0;
        }

        /* Frame Ujian Fullscreen */
        #examFrameContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: white;
            z-index: 1000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Modal Layar Terkunci Pengawas */
        #lockOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(217, 48, 37, 0.95);
            z-index: 9999;
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        #lockOverlay h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        #lockOverlay p {
            font-size: 16px;
            margin-bottom: 25px;
        }
        .pin-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 100%;
            max-width: 320px;
            color: #333;
        }
        .pin-box input {
            text-align: center;
            font-size: 20px;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }
        .btn-unlock {
            background-color: #d93025;
        }
        .btn-unlock:hover {
            background-color: #b31d16;
        }
    </style>
</head>
<body>

    <!-- Form Login Masuk Ujian -->
    <div class="container" id="loginBox">
        <h2>PORTAL UJIAN CBT</h2>
        <p class="subtitle">SMAN 1 Cikalongwetan</p>
        
        <div class="input-group">
            <label>NAMA LENGKAP</label>
            <input type="text" id="namaSiswa" placeholder="Masukkan nama lengkap" required>
        </div>

        <div class="input-group">
            <label>MATA PELAJARAN</label>
            <select id="mapelSelect">
                <option value="https://docs.google.com/forms/d/e/1FAIpQLSfkWYjbedejkV_rdRCiHiKe2fqdf-TwaqaV8Dxze75dzUl_Dg/viewform?embedded=true">Ekonomi</option>
            </select>
        </div>

        <div class="input-group">
            <label>TOKEN MASUK UJIAN</label>
            <input type="password" id="tokenMasuk" placeholder="Masukkan Token Ujian" required>
        </div>

        <button onclick="mulaiUjian()">MULAI UJIAN</button>
    </div>

    <!-- Tampilan Ujian (Iframe) -->
    <div id="examFrameContainer">
        <iframe id="examFrame" src=""></iframe>
    </div>

    <!-- Layar Penguncian (Hanya Buka Lewat PIN Pengawas) -->
    <div id="lockOverlay">
        <h1>UJIAN TERKUNCI!</h1>
        <p>Terdeteksi meninggalkan halaman/aplikasi ujian.<br>Silakan panggil <b>Pengawas</b> untuk membuka kuncian.</p>
        
        <div class="pin-box">
            <label style="text-align: center; margin-bottom: 10px;">PIN PENGAWAS</label>
            <input type="password" id="pinPengawasInput" placeholder="****" maxlength="8">
            <button class="btn-unlock" onclick="bukaKunci()">BUKA KUNCIAN</button>
        </div>
    </div>

    <script>
        // ================= KONFIGURASI =================
        const TOKEN_MASUK_VALID = "SMAN12026"; // Token siswa untuk masuk ujian
        const PIN_PENGAWAS = "123456";         // PIN khusus Pengawas untuk buka kuncian
        // ===============================================

        let sedangUjian = false;

        function mulaiUjian() {
            const nama = document.getElementById("namaSiswa").value.trim();
            const urlForm = document.getElementById("mapelSelect").value;
            const tokenInput = document.getElementById("tokenMasuk").value.trim();

            if (!nama) {
                alert("Harap isi Nama Lengkap terlebih dahulu!");
                return;
            }
            if (tokenInput !== TOKEN_MASUK_VALID) {
                alert("Token Ujian Salah!");
                return;
            }

            // Aktifkan Tampilan Ujian
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("examFrame").src = urlForm;
            document.getElementById("examFrameContainer").style.display = "block";
            
            sedangUjian = true;
        }

        // --- SISTEM DETEKSI PELANGGARAN ---
        // Deteksi HANYA saat siswa benar-benar keluar tab / berpindah aplikasi
        document.addEventListener("visibilitychange", function() {
            if (document.hidden && sedangUjian) {
                kunciLayar();
            }
        });

        function kunciLayar() {
            document.getElementById("lockOverlay").style.display = "flex";
        }

        function bukaKunci() {
            const inputPIN = document.getElementById("pinPengawasInput").value;

            if (inputPIN === PIN_PENGAWAS) {
                document.getElementById("lockOverlay").style.display = "none";
                document.getElementById("pinPengawasInput").value = ""; // Reset input
                alert("Kuncian berhasil dibuka. Silakan lanjutkan ujian.");
            } else {
                alert("PIN Pengawas Salah!");
                document.getElementById("pinPengawasInput").value = "";
            }
        }
    </script>
</body>
</html>
